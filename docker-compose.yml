# Local Postgres 18 for development and tests. Start with: docker compose up -d
# The version matches Neon, which runs the current Postgres release (spec 10.7).
# The credentials below are for this local container only; production uses Neon.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: scrappy
      POSTGRES_PASSWORD: scrappy
      POSTGRES_DB: scrappy
    # 5433 on the host: a Homebrew Postgres may already own 5432 on a dev machine.
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18's image expects the mount one level up from /data: it keeps the data
      # directory in a version-named subdirectory so pg_upgrade can work across versions.
      - pgdata:/var/lib/postgresql
      # Runs once, on first start with an empty volume: creates the scrappy_test database.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrappy -d scrappy"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
