# Checks that run on every pull request and every push to main (spec 10.8).
#
# The three jobs run in parallel and need no AWS credentials. Deploying is a separate job,
# added in m4/ci-deploy, which runs only after all three pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    # Tests run against real Postgres, not an in-memory stand-in: the matching query uses
    # Postgres-specific SQL (count(*) FILTER, array_agg, ANY) that SQLite would fake badly.
    # The version matches Neon and local Docker.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scrappy
          POSTGRES_PASSWORD: scrappy
          POSTGRES_DB: scrappy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scrappy -d scrappy_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # tests/conftest.py reads this; locally it defaults to port 5433.
      TEST_DATABASE_URL: postgresql+psycopg://scrappy:scrappy@localhost:5432/scrappy_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of step with pyproject.toml, which catches a
      # dependency added without committing the lock file.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest --cov

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs straight from the lock file, so it needs none of the peer-resolution
      # workarounds a local npm install does.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  infra:
    name: infra
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false skips the S3 backend, so this job needs no AWS credentials at all:
      # a pull request from any fork can be validated without touching the account.
      - name: Validate infra
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Validate bootstrap
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate

  # Deploys on merges to main, after all three checks pass (spec 10.8).
  deploy:
    name: deploy
    needs: [backend, frontend, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Two merges in quick succession queue rather than race. Cancelling midway through a
    # terraform apply can leave the state locked and the infrastructure half-updated, so
    # in-progress deploys are never cancelled.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    permissions:
      id-token: write # required to request the OIDC token
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # No AWS keys are stored in GitHub: this trades the run's OIDC token for credentials
      # that expire in minutes, and only works from main in this repository.
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # The same script used locally, so the package that was tested and the one that ships
      # are built identically.
      - name: Build the Lambda package
        run: ./scripts/build_lambda.sh
        working-directory: backend

      # Before the new code goes live, which is why migrations must be backward-compatible:
      # for a moment, the old code is running against the new schema.
      - name: Migrate the database
        run: uv run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}

      - name: Apply infrastructure
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra apply -auto-approve -input=false \
            -var "app_version=${{ github.sha }}"

      # Proves the new code is actually serving, not just that the deploy reported success:
      # /health echoes APP_VERSION, which Terraform set to this commit.
      - name: Smoke test
        run: |
          API_URL=$(terraform -chdir=infra output -raw api_url)
          # Steps do not share shell variables; GITHUB_ENV passes them to later steps.
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "COGNITO_USER_POOL_ID=$(terraform -chdir=infra output -raw cognito_user_pool_id)" >> "$GITHUB_ENV"
          echo "COGNITO_CLIENT_ID=$(terraform -chdir=infra output -raw cognito_client_id)" >> "$GITHUB_ENV"
          echo "API: $API_URL"

          version=$(curl --fail --silent --retry 5 --retry-delay 3 --retry-all-errors \
            "${API_URL}health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')

          if [ "$version" != "${{ github.sha }}" ]; then
            echo "::error::/health reports '$version', expected '${{ github.sha }}' — the old code is still serving"
            exit 1
          fi
          echo "live version matches this commit"

      - name: Build the frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
          # Public by design: the client has no secret, and both ids ship in the bundle.
          VITE_COGNITO_USER_POOL_ID: ${{ env.COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ env.COGNITO_CLIENT_ID }}

      # Order matters: hashed assets first, so index.html never points at files that have
      # not finished uploading. The assets are immutable (their names change when their
      # contents do); index.html must never be cached, or visitors keep the old one.
      - name: Upload the frontend
        run: |
          BUCKET=$(terraform -chdir=infra output -raw frontend_bucket)
          DISTRIBUTION=$(terraform -chdir=infra output -raw cloudfront_distribution_id)

          aws s3 sync frontend/dist/ "s3://$BUCKET/" --delete \
            --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"

          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/index.html"
